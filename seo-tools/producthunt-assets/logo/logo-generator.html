<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal/Noise ProductHunt Logo Generator</title>
    <style>
        /* Jony Ive Principle: Honest branding without artifice */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .logo-container {
            width: 240px;
            height: 240px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 20px; /* ProductHunt standard rounded corners */
        }

        .logo-text {
            font-size: 28px;
            font-weight: 300;
            color: #00ff88;
            text-align: center;
            line-height: 1.2;
            letter-spacing: 1px;
        }

        .logo-separator {
            width: 60px;
            height: 1px;
            background-color: #00ff88;
            margin: 8px 0;
            opacity: 0.6;
        }

        .logo-subtitle {
            font-size: 12px;
            font-weight: 100;
            color: #666666;
            text-align: center;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* Animated version styles */
        .logo-animated {
            animation: signalPulse 2s ease-in-out infinite;
        }

        @keyframes signalPulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.02);
            }
        }

        .logo-separator-animated {
            animation: separatorPulse 2s ease-in-out infinite;
        }

        @keyframes separatorPulse {
            0%, 100% {
                width: 60px;
                opacity: 0.6;
            }
            50% {
                width: 80px;
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Static Logo Version -->
    <div class="logo-container" id="logo-static">
        <div class="logo-text">
            Signal<br>Noise
        </div>
        <div class="logo-separator"></div>
        <div class="logo-subtitle">
            PRODUCTIVITY
        </div>
    </div>

    <script>
        // Switch between static and animated versions
        let isAnimated = false;

        function toggleAnimation() {
            const logoText = document.querySelector('.logo-text');
            const logoSeparator = document.querySelector('.logo-separator');

            if (isAnimated) {
                // Switch to static
                logoText.classList.remove('logo-animated');
                logoSeparator.classList.remove('logo-separator-animated');
                console.log('Switched to static logo version');
            } else {
                // Switch to animated
                logoText.classList.add('logo-animated');
                logoSeparator.classList.add('logo-separator-animated');
                console.log('Switched to animated logo version');
            }

            isAnimated = !isAnimated;
        }

        // Click to toggle versions for screenshot capture
        document.addEventListener('click', toggleAnimation);

        // Log design specifications
        console.log('Signal/Noise Logo Specifications:');
        console.log('Size: 240x240px (ProductHunt standard)');
        console.log('Background: Pure black (#000000)');
        console.log('Primary text: Signal green (#00ff88)');
        console.log('Secondary text: Dark gray (#666666)');
        console.log('Typography: San Francisco font family');
        console.log('Style: Minimal, consistent with app aesthetic');
        console.log('');
        console.log('Click anywhere to toggle between static and animated versions');
    </script>
</body>
</html>

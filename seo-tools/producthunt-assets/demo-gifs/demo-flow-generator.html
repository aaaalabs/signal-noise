<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal/Noise Demo Flow Generator</title>
    <style>
        /* Jony Ive Principle: Honest product demonstration */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .demo-container {
            width: 300px;
            height: 600px;
            background-color: #000000;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .demo-screen {
            width: 100%;
            height: 100%;
            background-color: #000000;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .demo-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .demo-title {
            font-size: 24px;
            font-weight: 100;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .demo-subtitle {
            font-size: 12px;
            color: #666666;
            letter-spacing: 1px;
        }

        .ratio-display-demo {
            text-align: center;
            margin-bottom: 40px;
        }

        .ratio-number-demo {
            font-size: 64px;
            font-weight: 100;
            color: #00ff88;
            line-height: 1;
            margin-bottom: 5px;
            transition: all 0.5s ease;
        }

        .ratio-label-demo {
            font-size: 14px;
            color: #666666;
            letter-spacing: 2px;
        }

        .task-demo-input {
            width: 100%;
            background-color: #111111;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 15px;
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }

        .demo-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 30px;
        }

        .demo-signal-btn {
            background-color: #00ff88;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .demo-noise-btn {
            background-color: #333333;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .demo-feedback {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #00ff88;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .demo-step-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 170, 0, 0.9);
            color: #000000;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 500;
        }

        /* Animation classes */
        .pulse {
            animation: pulse 1s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-screen">
            <!-- Step Indicator -->
            <div class="demo-step-indicator" id="step-indicator">Step 1/5</div>

            <!-- App Header -->
            <div class="demo-header">
                <div class="demo-title">Signal/Noise</div>
                <div class="demo-subtitle">PRODUCTIVITY METHOD</div>
            </div>

            <!-- Signal Ratio Display -->
            <div class="ratio-display-demo">
                <div class="ratio-number-demo" id="demo-ratio">34%</div>
                <div class="ratio-label-demo">SIGNAL RATIO</div>
            </div>

            <!-- Task Input -->
            <div>
                <input
                    type="text"
                    class="task-demo-input"
                    id="demo-input"
                    placeholder="What are you working on?"
                    value=""
                    readonly
                >

                <!-- Classification Buttons -->
                <div class="demo-buttons">
                    <button class="demo-signal-btn" id="demo-signal" onclick="classifyAsSignal()">
                        SIGNAL
                    </button>
                    <button class="demo-noise-btn" id="demo-noise" onclick="classifyAsNoise()">
                        NOISE
                    </button>
                </div>

                <!-- Feedback -->
                <div class="demo-feedback" id="demo-feedback">
                    Task classified successfully!
                </div>
            </div>
        </div>
    </div>

    <script>
        // Demo flow script for 30-second ProductHunt demo
        const demoSteps = [
            {
                step: 1,
                ratio: '34%',
                input: '',
                placeholder: 'What are you working on?',
                action: 'Show initial low signal ratio',
                duration: 3000
            },
            {
                step: 2,
                ratio: '34%',
                input: 'Check social media updates',
                placeholder: '',
                action: 'Type noise task',
                duration: 3000
            },
            {
                step: 3,
                ratio: '29%',
                input: '',
                placeholder: 'Task classified as Noise',
                action: 'Classify as Noise, ratio decreases',
                duration: 3000
            },
            {
                step: 4,
                ratio: '29%',
                input: 'Finish product demo video',
                placeholder: '',
                action: 'Type signal task',
                duration: 3000
            },
            {
                step: 5,
                ratio: '67%',
                input: '',
                placeholder: 'Signal ratio improved!',
                action: 'Classify as Signal, ratio increases',
                duration: 3000
            }
        ];

        let currentStep = 0;
        let isPlaying = false;

        function updateDemoStep(stepIndex) {
            const step = demoSteps[stepIndex];

            // Update step indicator
            document.getElementById('step-indicator').textContent = `Step ${step.step}/5`;

            // Update ratio with animation
            const ratioElement = document.getElementById('demo-ratio');
            ratioElement.textContent = step.ratio;
            ratioElement.classList.add('pulse');

            // Update input field
            const inputElement = document.getElementById('demo-input');
            inputElement.value = step.input;
            inputElement.placeholder = step.placeholder;

            // Show feedback if task was classified
            if (stepIndex === 2 || stepIndex === 4) {
                const feedback = document.getElementById('demo-feedback');
                feedback.style.opacity = '1';
                setTimeout(() => {
                    feedback.style.opacity = '0';
                }, 2000);
            }

            console.log(`Demo Step ${step.step}: ${step.action}`);

            // Remove animation class after animation completes
            setTimeout(() => {
                ratioElement.classList.remove('pulse');
            }, 1000);
        }

        function classifyAsSignal() {
            const feedback = document.getElementById('demo-feedback');
            feedback.textContent = '✅ Classified as SIGNAL';
            feedback.style.opacity = '1';
            setTimeout(() => {
                feedback.style.opacity = '0';
            }, 2000);
        }

        function classifyAsNoise() {
            const feedback = document.getElementById('demo-feedback');
            feedback.textContent = '⚪ Classified as NOISE';
            feedback.style.opacity = '1';
            setTimeout(() => {
                feedback.style.opacity = '0';
            }, 2000);
        }

        function playDemo() {
            if (isPlaying) return;

            isPlaying = true;
            currentStep = 0;

            const playNextStep = () => {
                if (currentStep < demoSteps.length) {
                    updateDemoStep(currentStep);
                    currentStep++;
                    setTimeout(playNextStep, demoSteps[currentStep - 1]?.duration || 3000);
                } else {
                    isPlaying = false;
                    console.log('Demo complete - ready for GIF capture');
                }
            };

            playNextStep();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ': // Spacebar to play demo
                    e.preventDefault();
                    playDemo();
                    break;
                case '1':
                case '2':
                case '3':
                case '4':
                case '5':
                    updateDemoStep(parseInt(e.key) - 1);
                    break;
            }
        });

        // Initialize
        window.addEventListener('load', () => {
            updateDemoStep(0);
            console.log('ProductHunt Demo Generator Ready');
            console.log('Press SPACEBAR to play full demo (30 seconds)');
            console.log('Press 1-5 to jump to specific steps');
            console.log('Perfect for screen recording or GIF capture');
        });

        // Export demo control for external use
        window.demoControls = {
            playDemo,
            updateStep: updateDemoStep,
            getCurrentStep: () => currentStep
        };
    </script>
</body>
</html>

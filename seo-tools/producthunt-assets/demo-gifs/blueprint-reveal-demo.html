<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal/Noise Blueprint Reveal Demo</title>
    <style>
        /* Blueprint reveal animation for ProductHunt demo */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased; /* Crisp text rendering */
            image-rendering: crisp-edges; /* Prevent blurry SVG rendering */
        }

        .demo-container {
            width: 400px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .loading-logo {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 45px; /* Golden ratio spacing: 28 × 1.618 ≈ 45 */
        }

        .loading-icon {
            position: relative;
            width: 140px;
            height: 140px;
        }

        .loading-outline-icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 1;
            animation: outlineFadeOut 4s ease-in-out forwards;
            shape-rendering: crispEdges; /* Prevent anti-aliasing gray areas */
        }

        .loading-solid-icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            animation: solidFadeIn 4s ease-in-out forwards;
            shape-rendering: crispEdges; /* Clean solid edges */
        }

        /* Single slow crossfade animation */
        @keyframes outlineFadeOut {
            0% {
                opacity: 1;
            }
            40% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        @keyframes solidFadeIn {
            0% {
                opacity: 0;
            }
            40% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .brand-text {
            text-align: center;
            opacity: 0;
            animation: textReveal 4s ease-in-out 2.8s forwards; /* Later reveal for priority */
        }

        .brand-name {
            font-size: 28px;
            font-weight: 300;
            color: #ffffff;
            margin-bottom: 12px; /* Golden ratio spacing */
            letter-spacing: 0.5px; /* Proportional to tagline */
        }

        .brand-tagline {
            font-size: 17px; /* Golden ratio: 28 ÷ 1.618 ≈ 17 */
            font-weight: 100; /* Lighter weight for hierarchy */
            color: #999999; /* Softer than harsh gray */
            letter-spacing: 1.5px; /* Proportional to brand name */
            text-transform: uppercase;
        }

        @keyframes textReveal {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Remove signal pulse - visual noise */
    </style>
</head>
<body>
    <div class="demo-container">
        <!-- Clean logo crossfade animation -->
        <div class="loading-logo" id="logo-container">
            <div class="loading-icon">
                <!-- Outline icon (blueprint) -->
                <svg class="loading-outline-icon" viewBox="0 0 554 558" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 557V1H553V317.562L312.41 557H1Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>

                <!-- Solid icon (final reveal) -->
                <svg class="loading-solid-icon" viewBox="0 0 554 558" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 557V1H553V317.562L312.41 557H1Z" fill="#00ff88" stroke="#00ff88"/>
                </svg>
            </div>
        </div>

        <!-- Brand text reveal -->
        <div class="brand-text">
            <div class="brand-name">Signal/Noise</div>
            <div class="brand-tagline">Productivity Method</div>
        </div>
    </div>

    <script>
        let isAnimating = false;

        function startBlueprintReveal() {
            if (isAnimating) return;

            isAnimating = true;
            console.log('Single slow crossfade animation started');

            // Animation completes automatically via CSS
            setTimeout(() => {
                isAnimating = false;
                console.log('Animation complete - permanent end state achieved');
            }, 4200);
        }

        // Automatic demo loop
        function startDemoLoop() {
            startBlueprintReveal();

            // Loop every 4 seconds for continuous demo
            setInterval(startBlueprintReveal, 4000);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ': // Spacebar
                    e.preventDefault();
                    startBlueprintReveal();
                    break;
                case 'l': // 'L' for loop
                    startDemoLoop();
                    break;
            }
        });

        // Initialize
        window.addEventListener('load', () => {
            console.log('Signal/Noise Single Fade Animation Ready');
            console.log('One slow, elegant crossfade - no resets, no loops');
            console.log('4-second animation: outline → solid → text reveal');
            console.log('Permanent end state - Jony Ive approved simplicity');

            // Single animation starts automatically
            setTimeout(startBlueprintReveal, 200);
        });

        // Export controls for external use
        window.blueprintControls = {
            startReveal: startBlueprintReveal,
            startLoop: startDemoLoop,
            isAnimating: () => isAnimating
        };
    </script>
</body>
</html>

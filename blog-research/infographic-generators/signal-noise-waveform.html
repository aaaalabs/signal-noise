<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal vs Noise Waveform - Information Theory</title>
    <style>
        /* Jony Ive Principle: Information theory made visually honest */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }

        .waveform-container {
            width: 1000px;
            max-width: 95vw;
            text-align: center;
        }

        .title {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .waveform-svg {
            width: 100%;
            height: 400px;
            margin-bottom: 30px;
        }

        .signal-wave {
            fill: none;
            stroke: #00ff88;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .noise-wave {
            fill: none;
            stroke: #ff6b6b;
            stroke-width: 2;
            opacity: 0.7;
        }

        .combined-wave {
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-dasharray: 3,3;
            opacity: 0.8;
        }

        .axis-line {
            stroke: #333333;
            stroke-width: 1;
        }

        .waveform-label {
            font-size: 14px;
            font-weight: 300;
            fill: #ffffff;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 300;
        }

        .legend-line {
            width: 30px;
            height: 3px;
        }

        .legend-signal { background-color: #00ff88; }
        .legend-noise { background-color: #ff6b6b; opacity: 0.7; }
        .legend-combined { background: repeating-linear-gradient(90deg, #ffffff 0px, #ffffff 3px, transparent 3px, transparent 6px); }

        .insight {
            font-size: 16px;
            font-weight: 300;
            color: #666666;
            margin-top: 30px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="waveform-container">
        <div class="title">Signal vs Noise: Information Theory Visualization</div>

        <svg class="waveform-svg" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
            <!-- Center line -->
            <line x1="50" y1="200" x2="950" y2="200" class="axis-line" />

            <!-- Time axis -->
            <line x1="50" y1="350" x2="950" y2="350" class="axis-line" />

            <!-- Waveforms generated by JavaScript -->
            <path id="signal-wave" class="signal-wave" />
            <path id="noise-wave" class="noise-wave" />
            <path id="combined-wave" class="combined-wave" />

            <!-- Labels -->
            <text x="500" y="380" class="waveform-label">Time →</text>
            <text x="30" y="100" class="waveform-label" transform="rotate(-90, 30, 100)">Amplitude</text>
        </svg>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-line legend-signal"></div>
                <span>Pure Signal (Productive Intent)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line legend-noise"></div>
                <span>Noise (Distractions)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line legend-combined"></div>
                <span>Reality (Signal + Noise)</span>
            </div>
        </div>

        <div class="insight">
            Claude Shannon's information theory: Clear signal corrupted by environmental noise<br>
            Productivity methodology: Identify pure signal, eliminate noise interference
        </div>
    </div>

    <script>
        function generateWaveforms() {
            // Pure signal: clean sine wave representing focused productivity
            const signalPoints = [];
            for (let x = 0; x <= 900; x += 2) {
                const t = (x / 900) * 4 * Math.PI; // 4 complete cycles
                const y = 200 + Math.sin(t) * 60; // Centered at 200, amplitude 60
                signalPoints.push(`${x + 50},${y}`);
            }
            document.getElementById('signal-wave').setAttribute('d', 'M' + signalPoints.join(' L'));

            // Noise: random interference
            const noisePoints = [];
            for (let x = 0; x <= 900; x += 1) {
                const randomNoise = (Math.random() - 0.5) * 40; // Random ±20 amplitude
                const y = 200 + randomNoise;
                noisePoints.push(`${x + 50},${y}`);
            }
            document.getElementById('noise-wave').setAttribute('d', 'M' + noisePoints.join(' L'));

            // Combined: signal corrupted by noise (reality)
            const combinedPoints = [];
            for (let x = 0; x <= 900; x += 2) {
                const t = (x / 900) * 4 * Math.PI;
                const signal = Math.sin(t) * 60;
                const noise = (Math.random() - 0.5) * 25; // Smaller noise amplitude
                const y = 200 + signal + noise;
                combinedPoints.push(`${x + 50},${y}`);
            }
            document.getElementById('combined-wave').setAttribute('d', 'M' + combinedPoints.join(' L'));
        }

        window.addEventListener('load', generateWaveforms);
    </script>
</body>
</html>

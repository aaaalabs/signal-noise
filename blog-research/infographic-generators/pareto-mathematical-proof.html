<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pareto Distribution Mathematical Proof</title>
    <style>
        /* Jony Ive Principle: Mathematical truth represented with clarity and honesty */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000; /* Pure black background */
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px; /* Generous whitespace margins */
        }

        .chart-container {
            width: 800px;
            max-width: 95vw;
            height: 600px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-title {
            font-size: 24px;
            font-weight: 300; /* Light weight for labels */
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .chart-svg {
            width: 100%;
            height: 500px;
            /* Positioned with precise centering */
        }

        .axis-line {
            stroke: #ffffff;
            stroke-width: 1; /* Thin white lines forming perfect right angle */
        }

        .grid-line {
            stroke: #222222; /* Very subtle gray for measurement grid */
            stroke-width: 1;
            opacity: 0.6;
        }

        .pareto-curve {
            fill: none;
            stroke: #00ff88; /* Signal green for mathematical accuracy */
            stroke-width: 2; /* 2-pixels for clarity */
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .normal-curve {
            fill: none;
            stroke: #666666; /* Faint dotted line for comparison */
            stroke-width: 1;
            stroke-dasharray: 3,3;
            opacity: 0.4;
        }

        .critical-marker-line {
            stroke: #666666; /* Subtle gray for critical markers */
            stroke-width: 1;
            stroke-dasharray: 2,2;
        }

        .critical-marker-point {
            fill: #00ff88; /* Signal green highlight */
            stroke: #00ff88;
            stroke-width: 1;
        }

        .axis-label {
            font-size: 14px;
            font-weight: 300; /* Font-weight 300 for axis labels */
            fill: #ffffff;
            text-anchor: middle;
        }

        .percentage-label {
            font-size: 12px;
            font-weight: 100; /* Font-weight 100 for numerical values */
            fill: #ffffff;
            text-anchor: middle;
        }

        .formula-display {
            position: absolute;
            top: 40px;
            right: 40px;
            font-size: 16px;
            font-weight: 300;
            color: #00ff88; /* Signal green for mathematical formula */
            letter-spacing: 0.5px;
            font-family: 'SF Mono', Menlo, Monaco, monospace; /* Monospace for formula */
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            font-size: 14px;
            font-weight: 300;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-line {
            width: 30px;
            height: 2px;
        }

        .legend-pareto {
            background-color: #00ff88;
        }

        .legend-normal {
            background-color: #666666;
            opacity: 0.4;
        }

        .mathematical-insight {
            text-align: center;
            margin-top: 30px;
            font-size: 16px;
            font-weight: 300;
            color: #666666;
            letter-spacing: 0.5px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <!-- Jony Ive Principle: Truth through accurate representation, beauty through mathematical precision -->
    <div class="chart-container">
        <div class="chart-title">Pareto Distribution: Mathematical Foundation of 80/20</div>

        <!-- Mathematical formula display positioned in upper right -->
        <div class="formula-display">
            P(X&gt;x) = (x<sub>m</sub>/x)<sup>α</sup>
            <br>
            <span style="font-size: 12px; color: #666666;">where α = log₄₅ ≈ 1.16</span>
        </div>

        <!-- SVG for mathematical precision and infinite scalability -->
        <svg class="chart-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- Coordinate system with perfect right angle -->
            <!-- Y-axis -->
            <line x1="80" y1="50" x2="80" y2="450" class="axis-line" />
            <!-- X-axis -->
            <line x1="80" y1="450" x2="720" y2="450" class="axis-line" />

            <!-- Minimal grid system at specified intervals -->
            <!-- Vertical grid lines at 20%, 40%, 60%, 80%, 100% -->
            <line x1="208" y1="50" x2="208" y2="450" class="grid-line" />
            <line x1="336" y1="50" x2="336" y2="450" class="grid-line" />
            <line x1="464" y1="50" x2="464" y2="450" class="grid-line" />
            <line x1="592" y1="50" x2="592" y2="450" class="grid-line" />
            <line x1="720" y1="50" x2="720" y2="450" class="grid-line" />

            <!-- Horizontal grid lines -->
            <line x1="80" y1="130" x2="720" y2="130" class="grid-line" />
            <line x1="80" y1="210" x2="720" y2="210" class="grid-line" />
            <line x1="80" y1="290" x2="720" y2="290" class="grid-line" />
            <line x1="80" y1="370" x2="720" y2="370" class="grid-line" />

            <!-- Axis labels with perfect mathematical spacing -->
            <text x="400" y="485" class="axis-label">Input Effort (%)</text>
            <text x="40" y="250" class="axis-label" transform="rotate(-90, 40, 250)">Output Results (%)</text>

            <!-- Percentage labels positioned with optical precision -->
            <text x="208" y="470" class="percentage-label">20</text>
            <text x="336" y="470" class="percentage-label">40</text>
            <text x="464" y="470" class="percentage-label">60</text>
            <text x="592" y="470" class="percentage-label">80</text>
            <text x="720" y="470" class="percentage-label">100</text>

            <text x="70" y="455" class="percentage-label">0</text>
            <text x="70" y="375" class="percentage-label">20</text>
            <text x="70" y="295" class="percentage-label">40</text>
            <text x="70" y="215" class="percentage-label">60</text>
            <text x="70" y="135" class="percentage-label">80</text>
            <text x="70" y="55" class="percentage-label">100</text>

            <!-- Critical 80/20 markers -->
            <!-- 80% horizontal line -->
            <line x1="80" y1="130" x2="720" y2="130" class="critical-marker-line" />
            <!-- 20% vertical line -->
            <line x1="208" y1="50" x2="208" y2="450" class="critical-marker-line" />
            <!-- Intersection point highlighted -->
            <circle cx="208" cy="130" r="4" class="critical-marker-point" />

            <!-- Pareto curve (will be generated by JavaScript) -->
            <path id="pareto-curve" class="pareto-curve" />

            <!-- Normal distribution comparison (optional, faint) -->
            <path id="normal-curve" class="normal-curve" />
        </svg>

        <!-- Legend with honest color representation -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-line legend-pareto"></div>
                <span>Pareto Distribution (80/20 Rule)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line legend-normal"></div>
                <span>Normal Distribution (Comparison)</span>
            </div>
        </div>

        <!-- Mathematical insight with human comprehension -->
        <div class="mathematical-insight">
            20% of effort generates 80% of results • Mathematical proof of Signal vs Noise methodology
        </div>
    </div>

    <script>
        // Mathematical precision: Generate actual Pareto distribution curve
        function generateParetoCurve() {
            const alpha = Math.log(4/5) / Math.log(0.8); // α = log₄₅ ≈ 1.16
            const xMin = 0.01; // Minimum x value to avoid division by zero
            const points = [];

            // Generate curve points with mathematical accuracy
            for (let effort = 1; effort <= 100; effort += 0.5) {
                const x = effort / 100; // Convert to decimal (0-1)
                const xScaled = Math.max(x, xMin); // Avoid mathematical errors

                // Pareto cumulative distribution function
                const result = 1 - Math.pow(xMin / xScaled, alpha);
                const resultPercent = Math.min(result * 100, 100); // Cap at 100%

                // Convert to SVG coordinates
                const svgX = 80 + (effort * 6.4); // Scale to 640px width
                const svgY = 450 - (resultPercent * 4); // Scale to 400px height, invert Y

                points.push(`${svgX},${svgY}`);
            }

            // Create SVG path with mathematical precision
            const pathData = 'M' + points.join(' L');
            document.getElementById('pareto-curve').setAttribute('d', pathData);

            console.log('Pareto alpha value:', alpha.toFixed(3));
            console.log('20% effort result:', calculateParetoValue(20, alpha).toFixed(1) + '%');
            console.log('80% effort result:', calculateParetoValue(80, alpha).toFixed(1) + '%');
        }

        // Calculate specific Pareto values for validation
        function calculateParetoValue(effortPercent, alpha) {
            const x = effortPercent / 100;
            const xMin = 0.01;
            const result = 1 - Math.pow(xMin / Math.max(x, xMin), alpha);
            return result * 100;
        }

        // Generate normal distribution for comparison
        function generateNormalCurve() {
            const points = [];

            for (let effort = 1; effort <= 100; effort += 1) {
                // Simple linear relationship for normal distribution comparison
                const result = effort; // 1:1 relationship

                const svgX = 80 + (effort * 6.4);
                const svgY = 450 - (result * 4);

                points.push(`${svgX},${svgY}`);
            }

            const pathData = 'M' + points.join(' L');
            document.getElementById('normal-curve').setAttribute('d', pathData);
        }

        // Initialize mathematical visualization
        window.addEventListener('load', () => {
            generateParetoCurve();
            generateNormalCurve();

            // Validate the 80/20 principle mathematically
            const alpha = Math.log(4/5) / Math.log(0.8);
            const twentyPercentResult = calculateParetoValue(20, alpha);
            const eightyPercentResult = calculateParetoValue(80, alpha);

            console.log('Mathematical validation:');
            console.log('20% effort produces', twentyPercentResult.toFixed(1) + '% results');
            console.log('80% effort produces', eightyPercentResult.toFixed(1) + '% results');
            console.log('Validates 80/20 principle:', twentyPercentResult > 70 ? 'Yes' : 'No');
        });
    </script>
</body>
</html>

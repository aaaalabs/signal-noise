<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementation Workspace - Section Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .desk-scene {
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
        }

        .desk-surface {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: #252525;
            border-top: 4px solid #00ff88;
        }

        .notebook {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 350px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 40px;
        }

        .notebook-title {
            font-size: 24px;
            font-weight: 300;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #00ff88;
            padding-bottom: 15px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #00ff88;
        }

        .task-number {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #00ff88;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            color: #1a1a1a;
            font-weight: 400;
        }

        .task-badge {
            background: #00ff88;
            color: #1a1a1a;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .coffee-cup {
            position: absolute;
            top: 20%;
            right: 15%;
            width: 80px;
            height: 100px;
            background: #3a3a3a;
            border-radius: 0 0 40px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .coffee-cup::before {
            content: '';
            position: absolute;
            top: 20px;
            right: -25px;
            width: 30px;
            height: 40px;
            border: 4px solid #3a3a3a;
            border-left: none;
            border-radius: 0 20px 20px 0;
        }

        .steam {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            opacity: 0.6;
            animation: steam 3s ease-in-out infinite;
        }

        @keyframes steam {
            0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.6; }
            50% { transform: translateX(-50%) translateY(-10px); opacity: 0.3; }
        }

        .lamp-glow {
            position: absolute;
            top: 10%;
            left: 20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.2) 0%, transparent 70%);
            border-radius: 50%;
        }

        .title-overlay {
            position: absolute;
            top: 40px;
            left: 80px;
            font-size: 32px;
            color: white;
            font-weight: 300;
        }

        .title-highlight {
            color: #00ff88;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="desk-scene">
        <div class="lamp-glow"></div>

        <div class="title-overlay">
            Your <span class="title-highlight">Three Things</span> Workspace
        </div>

        <div class="desk-surface">
            <div class="notebook">
                <div class="notebook-title">Today's Transformational Focus</div>

                <div class="task-list">
                    <div class="task">
                        <div class="task-number">1</div>
                        <div class="task-text">Close the strategic partnership deal</div>
                        <div class="task-badge">Transform</div>
                    </div>

                    <div class="task">
                        <div class="task-number">2</div>
                        <div class="task-text">Finalize breakthrough product feature</div>
                        <div class="task-badge">Transform</div>
                    </div>

                    <div class="task">
                        <div class="task-number">3</div>
                        <div class="task-text">Build relationship with key mentor</div>
                        <div class="task-badge">Transform</div>
                    </div>
                </div>
            </div>

            <div class="coffee-cup">
                <div class="steam">☕</div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Things Productivity System - Hero Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1600px;
            height: 900px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 100px, #00ff88 100px, #00ff88 101px),
                repeating-linear-gradient(90deg, transparent, transparent 100px, #00ff88 100px, #00ff88 101px);
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 0 100px;
        }

        .pre-title {
            font-size: 24px;
            color: #00ff88;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .title {
            font-size: 96px;
            font-weight: 100;
            color: white;
            line-height: 1.1;
            margin-bottom: 40px;
        }

        .title-number {
            font-size: 180px;
            font-weight: 600;
            color: #00ff88;
            display: inline-block;
            margin: 0 20px;
        }

        .subtitle {
            font-size: 36px;
            color: #999;
            font-weight: 300;
            margin-bottom: 60px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .highlight {
            color: #00ff88;
            font-weight: 400;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-top: 60px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 72px;
            font-weight: 100;
            color: #00ff88;
            line-height: 1;
            margin-bottom: 15px;
        }

        .stat-label {
            font-size: 18px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge {
            position: absolute;
            top: 60px;
            right: 60px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 30px;
            padding: 15px 30px;
            font-size: 20px;
            color: #00ff88;
            font-weight: 600;
        }

        .accent-dots {
            position: absolute;
            bottom: 60px;
            left: 60px;
            display: flex;
            gap: 20px;
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00ff88;
            opacity: 0.3;
        }

        .dot:nth-child(2) {
            opacity: 0.6;
        }

        .dot:nth-child(3) {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <div class="content">
        <div class="pre-title">Science-Backed Productivity</div>

        <div class="title">
            The<span class="title-number">3</span>Things<br/>
            Productivity System
        </div>

        <div class="subtitle">
            Stop being busy. Start being productive.<br/>
            Focus on <span class="highlight">transformational work</span> and achieve <span class="highlight">37× improvement</span> in one year
        </div>

        <div class="stats-row">
            <div class="stat">
                <div class="stat-number">1,095</div>
                <div class="stat-label">Transformational Tasks per Year</div>
            </div>

            <div class="stat">
                <div class="stat-number">20+</div>
                <div class="stat-label">Verified Research Sources</div>
            </div>

            <div class="stat">
                <div class="stat-number">100+</div>
                <div class="stat-label">Years of Productivity Science</div>
            </div>
        </div>
    </div>

    <div class="badge">Research-Backed</div>

    <div class="accent-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</body>
</html>

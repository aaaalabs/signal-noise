<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuroscience of Focus - Section Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d2d2d 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .brain-visual {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            opacity: 0.1;
        }

        .brain-circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid #00ff88;
        }

        .brain-circle:nth-child(1) {
            width: 100%;
            height: 100%;
            animation: pulse 4s ease-in-out infinite;
        }

        .brain-circle:nth-child(2) {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            animation: pulse 4s ease-in-out infinite 0.5s;
        }

        .brain-circle:nth-child(3) {
            width: 40%;
            height: 40%;
            top: 30%;
            left: 30%;
            animation: pulse 4s ease-in-out infinite 1s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }

        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 80px;
        }

        .section-label {
            font-size: 20px;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
        }

        .title {
            font-size: 64px;
            font-weight: 300;
            color: white;
            text-align: center;
            margin-bottom: 60px;
            line-height: 1.2;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }

        .stat-card {
            background: rgba(0, 255, 136, 0.05);
            border: 2px solid rgba(0, 255, 136, 0.2);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 56px;
            font-weight: 100;
            color: #00ff88;
            line-height: 1;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 16px;
            color: #999;
        }

        .stat-source {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="brain-visual">
        <div class="brain-circle"></div>
        <div class="brain-circle"></div>
        <div class="brain-circle"></div>
    </div>

    <div class="content">
        <div class="section-label">The Science</div>

        <div class="title">
            Why Your Brain Can Only<br/>Handle Three Things
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">🧠</div>
                <div class="stat-value">6 hrs</div>
                <div class="stat-label">True focus capacity per week</div>
                <div class="stat-source">Dr. David Rock, NeuroLeadership Institute</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value">23 min</div>
                <div class="stat-label">Time to refocus after interruption</div>
                <div class="stat-source">UC Irvine Research</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">📉</div>
                <div class="stat-value">40%</div>
                <div class="stat-label">Productivity loss from multitasking</div>
                <div class="stat-source">American Psychological Association</div>
            </div>
        </div>
    </div>
</body>
</html>

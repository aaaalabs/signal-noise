<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warren Buffett Quote - Social Share</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .accent-line {
            position: absolute;
            left: 0;
            top: 0;
            width: 8px;
            height: 100%;
            background: #00ff88;
        }

        .quote-mark {
            font-size: 120px;
            color: #00ff88;
            opacity: 0.3;
            line-height: 0.8;
            margin-bottom: 30px;
        }

        .quote-text {
            font-size: 48px;
            font-weight: 300;
            color: white;
            line-height: 1.3;
            margin-bottom: 50px;
            max-width: 900px;
        }

        .quote-highlight {
            color: #00ff88;
            font-weight: 500;
        }

        .attribution {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .attribution-text {
            font-size: 28px;
            color: #999;
            font-weight: 300;
        }

        .attribution-name {
            color: white;
            font-weight: 400;
        }

        .footer {
            position: absolute;
            bottom: 50px;
            right: 80px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: #00ff88;
        }

        .separator {
            width: 2px;
            height: 25px;
            background: #444;
        }

        .tagline {
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="accent-line"></div>

        <div class="quote-mark">"</div>

        <div class="quote-text">
            The difference between successful people and really successful people is that <span class="quote-highlight">really successful people say no to almost everything</span>
        </div>

        <div class="attribution">
            <div class="attribution-text">
                — <span class="attribution-name">Warren Buffett</span>
            </div>
        </div>

        <div class="footer">
            <div class="logo">Signal/Noise</div>
            <div class="separator"></div>
            <div class="tagline">Three Things Productivity</div>
        </div>
    </div>
</body>
</html>

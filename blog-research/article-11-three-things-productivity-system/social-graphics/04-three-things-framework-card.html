<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Things Framework - Social Share</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .card {
            width: 100%;
            height: 100%;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 50px, #00ff88 50px, #00ff88 51px),
                repeating-linear-gradient(90deg, transparent, transparent 50px, #00ff88 50px, #00ff88 51px);
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .title {
            font-size: 56px;
            font-weight: 300;
            color: white;
            margin-bottom: 60px;
            text-align: center;
        }

        .title-highlight {
            color: #00ff88;
            font-weight: 600;
        }

        .framework {
            display: flex;
            justify-content: space-around;
            margin-bottom: 60px;
        }

        .level {
            text-align: center;
            flex: 1;
        }

        .level-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 20px;
            border: 3px solid;
        }

        .level-1 .level-icon {
            background: rgba(255, 107, 107, 0.1);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .level-2 .level-icon {
            background: rgba(255, 215, 0, 0.1);
            border-color: #ffd700;
            color: #ffd700;
        }

        .level-3 .level-icon {
            background: rgba(0, 255, 136, 0.1);
            border-color: #00ff88;
            color: #00ff88;
        }

        .level-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .level-1 .level-name { color: #ff6b6b; }
        .level-2 .level-name { color: #ffd700; }
        .level-3 .level-name { color: #00ff88; }

        .level-time {
            font-size: 32px;
            font-weight: 100;
            color: white;
            margin-bottom: 8px;
        }

        .level-desc {
            font-size: 16px;
            color: #999;
        }

        .cta {
            text-align: center;
            background: rgba(0, 255, 136, 0.1);
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #00ff88;
        }

        .cta-text {
            font-size: 28px;
            color: white;
            font-weight: 400;
        }

        .cta-highlight {
            color: #00ff88;
            font-weight: 600;
        }

        .footer {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: #00ff88;
        }

        .separator {
            width: 2px;
            height: 25px;
            background: #444;
        }

        .tagline {
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="bg-pattern"></div>

        <div class="content">
            <div class="title">
                Flip your time allocation for <span class="title-highlight">exponential results</span>
            </div>

            <div class="framework">
                <div class="level level-1">
                    <div class="level-icon">📋</div>
                    <div class="level-name">MAINTENANCE</div>
                    <div class="level-time">10%</div>
                    <div class="level-desc">Batch & delegate</div>
                </div>

                <div class="level level-2">
                    <div class="level-icon">⚙️</div>
                    <div class="level-name">OPTIMIZATION</div>
                    <div class="level-time">20%</div>
                    <div class="level-desc">Schedule strategically</div>
                </div>

                <div class="level level-3">
                    <div class="level-icon">🚀</div>
                    <div class="level-name">TRANSFORMATION</div>
                    <div class="level-time">70%</div>
                    <div class="level-desc">Your 3 Things</div>
                </div>
            </div>

            <div class="cta">
                <div class="cta-text">
                    Focus on <span class="cta-highlight">3 transformational tasks</span> daily = 1,095 breakthroughs per year
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="logo">Signal/Noise</div>
            <div class="separator"></div>
            <div class="tagline">Science-Backed Productivity</div>
        </div>
    </div>
</body>
</html>

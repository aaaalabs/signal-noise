<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Switching Cost - Social Share</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ff6b6b;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .card {
            width: 100%;
            height: 100%;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .warning-icon {
            font-size: 80px;
            margin-bottom: 30px;
        }

        .headline {
            font-size: 48px;
            font-weight: 600;
            color: white;
            margin-bottom: 50px;
            line-height: 1.2;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 50px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .stat-number {
            font-size: 56px;
            font-weight: 100;
            color: white;
            line-height: 1;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        .solution {
            background: #1a1a1a;
            padding: 30px 40px;
            border-radius: 12px;
            border-left: 6px solid #00ff88;
        }

        .solution-text {
            font-size: 28px;
            color: white;
            font-weight: 400;
        }

        .solution-highlight {
            color: #00ff88;
            font-weight: 600;
        }

        .footer {
            position: absolute;
            bottom: 50px;
            right: 80px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: white;
        }

        .separator {
            width: 2px;
            height: 25px;
            background: rgba(255, 255, 255, 0.4);
        }

        .tagline {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="warning-icon">⚠️</div>

        <div class="headline">
            Context Switching is Destroying Your Productivity
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-number">1,200</div>
                <div class="stat-label">App switches per day</div>
            </div>

            <div class="stat-box">
                <div class="stat-number">23 min</div>
                <div class="stat-label">Time to refocus after interruption</div>
            </div>

            <div class="stat-box">
                <div class="stat-number">40%</div>
                <div class="stat-label">Productivity loss from multitasking</div>
            </div>

            <div class="stat-box">
                <div class="stat-number">$450B</div>
                <div class="stat-label">Annual US economic cost</div>
            </div>
        </div>

        <div class="solution">
            <div class="solution-text">
                Solution: <span class="solution-highlight">3 focused tasks</span> instead of 20 scattered ones
            </div>
        </div>

        <div class="footer">
            <div class="logo">Signal/Noise</div>
            <div class="separator"></div>
            <div class="tagline">Three Things Productivity</div>
        </div>
    </div>
</body>
</html>
